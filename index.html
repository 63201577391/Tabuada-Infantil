<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuada Divertida Infantil</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4ECDC4">
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --bg: #F7F9FC;
      --text: #2C3E50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; text-align: center; }
    header { margin-bottom: 20px; }
    h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 10px; }
    .nav-btn { background: var(--secondary); color: white; border: none; padding: 10px 18px; margin: 4px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .restart-btn { background: #FF9F43; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .btn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
    .num-btn { background: var(--accent); border: 2px solid #E6C200; padding: 10px; font-weight: bold; font-size: 1.2rem; border-radius: 10px; cursor: pointer; }
    .quiz-option { background: var(--bg); border: 2px solid var(--secondary); padding: 15px; font-size: 1.5rem; font-weight: bold; border-radius: 10px; margin: 8px 0; width: 100%; cursor: pointer; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 90%; }
    .emoji-group { margin: 5px 0; font-size: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <h1>🧩 Tabuada Divertida 🧩</h1>
    <button class="nav-btn" onclick="switchMode('learn')">📖 Modo Aprender</button>
    <button class="nav-btn" onclick="switchMode('quiz')">🎯 Modo Quiz</button>
    <button class="nav-btn restart-btn" onclick="confirmRestart()">🔄 Recomeçar Jogo</button>
  </header>

  <main class="container">
    <!-- Modo Aprender -->
    <section id="learn-section">
      <h2>Escolha a Tabuada:</h2>
      <div class="btn-grid" id="learn-btns"></div>
      <div id="learn-content" class="hidden">
        <h3 id="table-title"></h3>
        <button class="nav-btn" style="background:var(--primary)" onclick="speakCurrentTable()">🔊 Ouvir Tabuada</button>
        <div id="table-display" style="margin-top:15px; text-align:left;"></div>
      </div>
    </section>

    <!-- Modo Quiz -->
    <section id="quiz-section" class="hidden">
      <div id="level-selector">
        <h2>Escolha o Nível:</h2>
        <button class="quiz-option" onclick="startQuiz('easy')">🌱 Nível Fácil (1, 2, 3, 5, 10)</button>
        <button class="quiz-option" id="btn-medium" onclick="startQuiz('medium')" disabled>🔥 Nível Médio (Desbloqueie a 100 pts)</button>
        <button class="quiz-option" id="btn-hard" onclick="startQuiz('hard')" disabled>⚡ Nível Difícil (Desbloqueie a 100 pts no Médio)</button>
      </div>
      <div id="quiz-game" class="hidden">
        <p>Pontos: <span id="score">0</span> | Acertos: <span id="hits">0</span> | Erros: <span id="errors">0</span></p>
        <h2 id="question-text" style="font-size: 2.5rem; margin: 20px 0;"></h2>
        <div id="options-container"></div>
      </div>
    </section>
  </main>

  <!-- Modal Erro Didático -->
  <div id="error-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="color:var(--primary)">Ops! Vamos aprender juntos? 💡</h3>
      <p id="error-explanation" style="margin: 15px 0; text-align:left;"></p>
      <div id="error-emojis" style="margin-bottom: 15px;"></div>
      <button class="nav-btn" onclick="closeErrorModal()">Entendi! Próxima 🚀</button>
    </div>
  </div>

  <script>
    let currentTableNum = 1;
    let quizState = { level: 'easy', score: 0, hits: 0, errors: 0, currentQ: null };
    let progress = JSON.parse(localStorage.getItem('tabuada_progress')) || { scoreEasy: 0, scoreMedium: 0 };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function init() {
      const grid = document.getElementById('learn-btns');
      grid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => loadLearnTable(i);
        grid.appendChild(btn);
      }
      updateQuizButtons();
    }

    function updateQuizButtons() {
      const btnMedium = document.getElementById('btn-medium');
      const btnHard = document.getElementById('btn-hard');

      if (progress.scoreEasy >= 100) {
        btnMedium.disabled = false;
        btnMedium.innerText = '🔥 Nível Médio (3, 4, 5, 6, 7)';
      } else {
        btnMedium.disabled = true;
        btnMedium.innerText = '🔥 Nível Médio (Desbloqueie a 100 pts)';
      }

      if (progress.scoreMedium >= 100) {
        btnHard.disabled = false;
        btnHard.innerText = '⚡ Nível Difícil (6, 7, 8, 9, 10)';
      } else {
        btnHard.disabled = true;
        btnHard.innerText = '⚡ Nível Difícil (Desbloqueie a 100 pts no Médio)';
      }
    }

    function loadLearnTable(num) {
      currentTableNum = num;
      document.getElementById('learn-content').classList.remove('hidden');
      document.getElementById('table-title').innerText = `Tabuada do ${num}`;
      const display = document.getElementById('table-display');
      display.innerHTML = '';
      
      const emojis = ['⭐️', '🍎', '🎈', '🐱', '🐶', '⚽️', '🚗', '🍓', '🚀', '👑'];
      const icon = emojis[num - 1];

      for (let i = 1; i <= 10; i++) {
        const row = document.createElement('div');
        row.style.margin = '8px 0';
        row.innerHTML = `<strong>${num} × ${i} = ${num * i}</strong> <span class="emoji-group">${icon.repeat(i)}</span>`;
        display.appendChild(row);
      }
    }

    function speakCurrentTable() {
      if ('speechSynthesis' in window) {
        let text = `Tabuada do ${currentTableNum}. `;
        for (let i = 1; i <= 10; i++) {
          text += `${currentTableNum} vezes ${i} é igual a ${currentTableNum * i}. `;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        window.speechSynthesis.speak(utterance);
      }
    }

    function switchMode(mode) {
      document.getElementById('learn-section').classList.toggle('hidden', mode !== 'learn');
      document.getElementById('quiz-section').classList.toggle('hidden', mode !== 'quiz');
    }

    function startQuiz(level) {
      quizState = { level, score: 0, hits: 0, errors: 0, currentQ: null };
      document.getElementById('level-selector').classList.add('hidden');
      document.getElementById('quiz-game').classList.remove('hidden');
      updateStats();
      nextQuestion();
    }

    function nextQuestion() {
      const levels = {
        easy: [1, 2, 3, 5, 10],
        medium: [3, 4, 5, 6, 7],
        hard: [6, 7, 8, 9, 10]
      };
      const tables = levels[quizState.level];
      const n1 = tables[Math.floor(Math.random() * tables.length)];
      const n2 = Math.floor(Math.random() * 10) + 1;
      const correct = n1 * n2;

      quizState.currentQ = { n1, n2, correct };

      document.getElementById('question-text').innerText = `${n1} × ${n2} = ?`;
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      let options = [correct];
      while (options.length < 4) {
        let wrong = (Math.floor(Math.random() * 10) + 1) * (Math.floor(Math.random() * 10) + 1);
        if (!options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const { n1, n2, correct } = quizState.currentQ;
      if (selected === correct) {
        quizState.score += 10;
        quizState.hits++;
        if (quizState.level === 'easy' && quizState.score > progress.scoreEasy) progress.scoreEasy = quizState.score;
        if (quizState.level === 'medium' && quizState.score > progress.scoreMedium) progress.scoreMedium = quizState.score;
        localStorage.setItem('tabuada_progress', JSON.stringify(progress));
        updateQuizButtons();
        updateStats();
        nextQuestion();
      } else {
        quizState.errors++;
        updateStats();
        showErrorExplanation(n1, n2, correct);
      }
    }

    function updateStats() {
      document.getElementById('score').innerText = quizState.score;
      document.getElementById('hits').innerText = quizState.hits;
      document.getElementById('errors').innerText = quizState.errors;
    }

    function showErrorExplanation(n1, n2, correct) {
      const modal = document.getElementById('error-modal');
      const text = document.getElementById('error-explanation');
      const emojisDiv = document.getElementById('error-emojis');

      let sumStr = Array(n2).fill(n1).join(' + ');
      text.innerHTML = `A resposta correta para <strong>${n1} × ${n2}</strong> é <strong>${correct}</strong>.<br><br>` +
                       `Multiplicar é o mesmo que somar várias vezes:<br>` +
                       `<strong>${sumStr} = ${correct}</strong>`;

      emojisDiv.innerHTML = '';
      for (let i = 0; i < n2; i++) {
        const group = document.createElement('div');
        group.className = 'emoji-group';
        group.innerText = `Grupo ${i + 1}: ` + '🌟'.repeat(n1);
        emojisDiv.appendChild(group);
      }

      modal.classList.remove('hidden');
    }

    function closeErrorModal() {
      document.getElementById('error-modal').classList.add('hidden');
      nextQuestion();
    }

    function confirmRestart() {
      const resetAll = confirm("Queres recomeçar o jogo?\n\nClique em 'OK' para recomeçar a partida atual ou voltar ao menu.\n(Dica: se quiseres APAGAR todo o progresso e bloquear os níveis novamente, podes fazer isso a seguir).");
      
      if (resetAll) {
        const clearStorage = confirm("Queres também APAGAR todos os pontos acumulados e bloquear os níveis médios/difíceis?");
        if (clearStorage) {
          localStorage.removeItem('tabuada_progress');
          progress = { scoreEasy: 0, scoreMedium: 0 };
          updateQuizButtons();
        }
        
        quizState = { level: 'easy', score: 0, hits: 0, errors: 0, currentQ: null };
        document.getElementById('quiz-game').classList.add('hidden');
        document.getElementById('level-selector').classList.remove('hidden');
        switchMode('quiz');
      }
    }

    init();
  </script>
</body>
</html>
