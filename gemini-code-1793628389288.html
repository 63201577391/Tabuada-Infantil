<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabuada Infantil Divertida</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tabuada">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; }
        .btn-push { transition: all 0.1s ease; }
        .btn-push:active { transform: translateY(4px); box-shadow: none !important; }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-200">

    <header class="w-full max-w-md text-center py-2 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-700 flex items-center gap-2">
            <i data-lucide="sparkles" class="text-yellow-400 fill-yellow-400"></i> Tabuada Mágica
        </h1>
        <button id="installAppBtn" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 px-3 rounded-full text-xs shadow-md flex items-center gap-1 animate-bounce">
            <i data-lucide="download" class="w-4 h-4"></i> Instalar App
        </button>
    </header>

    <div class="w-full max-w-md bg-white rounded-3xl p-2 shadow-sm border-2 border-indigo-100 flex justify-between mb-4">
        <button onclick="setMode('study')" id="nav-study" class="flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all bg-indigo-600 text-white shadow-md">
            <i data-lucide="book-open" class="w-4 h-4"></i> Aprender
        </button>
        <button onclick="setMode('quiz')" id="nav-quiz" class="flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all text-gray-500 hover:bg-indigo-50">
            <i data-lucide="gamepad-2" class="w-4 h-4"></i> Jogar Quiz
        </button>
    </div>

    <!-- MODO ESTUDO -->
    <main id="view-study" class="w-full max-w-md flex-1 flex flex-col items-center">
        <div class="w-full flex gap-1.5 overflow-x-auto pb-2 scrollbar-none snap-x">
            <script>
                for(let i=1; i<=10; i++){
                    document.write(`<button onclick="selectTab(${i})" id="tab-btn-${i}" class="snap-center flex-shrink-0 w-11 h-11 rounded-2xl font-bold text-lg border-b-4 transition-all ${i===1?'bg-indigo-500 text-white border-indigo-700':'bg-white text-gray-700 border-gray-200'}">${i}</button>`);
                }
            </script>
        </div>

        <div class="w-full bg-white rounded-3xl p-5 shadow-lg border-2 border-indigo-100 mt-2 flex-1 flex flex-col justify-between">
            <div class="flex justify-between items-center border-b pb-3 border-gray-100">
                <h2 id="study-title" class="text-xl font-bold text-indigo-800">Tabuada do 1</h2>
                <button onclick="speakCurrentTable()" class="bg-pink-100 text-pink-600 hover:bg-pink-200 p-2 rounded-full font-bold text-xs flex items-center gap-1 transition-colors">
                    <i data-lucide="volume-2" class="w-5 h-5"></i> Ouvir
                </button>
            </div>
            <div id="study-list" class="space-y-2 my-4 max-h-[50vh] overflow-y-auto pr-1"></div>
        </div>
    </main>

    <!-- MODO QUIZ -->
    <main id="view-quiz" class="w-full max-w-md flex-1 flex-col items-center hidden">
        <div class="w-full bg-white rounded-3xl p-4 shadow-sm border-2 border-indigo-100 mb-3 flex justify-between items-center text-sm font-bold">
            <div class="flex items-center gap-1.5 text-amber-500">
                <i data-lucide="trophy" class="w-5 h-5"></i> <span id="score-display">0 pts</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-emerald-500 flex items-center gap-1"><i data-lucide="check-circle-2" class="w-4 h-4"></i> <span id="correct-count">0</span></span>
                <span class="text-rose-500 flex items-center gap-1"><i data-lucide="x-circle" class="w-4 h-4"></i> <span id="wrong-count">0</span></span>
            </div>
        </div>

        <div id="quiz-box" class="w-full bg-white rounded-3xl p-6 shadow-lg border-2 border-indigo-100 flex-1 flex flex-col justify-between items-center text-center">
            <div class="w-full">
                <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">Pergunta <span id="q-num">1</span> de 10</div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mb-6">
                    <div id="q-progress" class="bg-indigo-500 h-full w-10 transition-all duration-300"></div>
                </div>
                <div id="question-text" class="text-4xl font-extrabold text-indigo-900 my-4 py-4 bg-indigo-50 rounded-2xl border-2 border-indigo-100">
                    2 x 3 = ?
                </div>
            </div>

            <div id="answers-grid" class="grid grid-cols-2 gap-3 w-full my-4"></div>
            
            <!-- ÁREA DE FEEDBACK COM JUSTIFICATIVA DE 10 SEGUNDOS -->
            <div id="feedback-container" class="min-h-[70px] w-full flex items-center justify-center">
                <div id="feedback-msg" class="w-full p-3 rounded-2xl text-xs sm:text-sm font-bold hidden"></div>
            </div>
        </div>

        <!-- TELA FINAL DO QUIZ -->
        <div id="quiz-results" class="w-full bg-white rounded-3xl p-6 shadow-lg border-2 border-indigo-100 flex-1 flex-col justify-center items-center text-center hidden">
            <div class="text-5xl mb-2">🏆</div>
            <h2 class="text-2xl font-bold text-indigo-900 mb-1">Parabéns!</h2>
            <p class="text-gray-500 text-sm mb-4">Você concluiu o desafio da tabuada!</p>
            <div class="text-yellow-400 flex justify-center gap-1 text-3xl mb-4" id="stars-result">⭐⭐⭐</div>
            <div class="bg-indigo-50 p-4 rounded-2xl w-full mb-6">
                <div class="text-indigo-900 font-bold text-lg" id="final-score">Pontuação: 100 pts</div>
                <div class="text-xs text-indigo-500 mt-1" id="final-stats">10 acertos / 0 erros</div>
            </div>
            <button onclick="startQuiz()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md btn-push">
                Jogar Novamente
            </button>
        </div>
    </main>

    <script>
        // PWA Service Worker Registration
        let deferredPrompt;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installAppBtn');
            if (installBtn) installBtn.classList.remove('hidden');
        });

        document.getElementById('installAppBtn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installAppBtn').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // App Logic
        let currentTab = 1;
        let currentMode = 'study';
        let quizQuestions = [], quizIndex = 0, score = 0, correctAnswers = 0, wrongAnswers = 0;

        const emojis = ['🍎', '🚀', '⭐', '🎈', '🐶', '🐱', '⚽', '🚗', '🍓', '🍦'];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('view-study').classList.toggle('hidden', mode !== 'study');
            document.getElementById('view-quiz').classList.toggle('hidden', mode !== 'quiz');
            document.getElementById('view-study').classList.toggle('flex', mode === 'study');
            document.getElementById('view-quiz').classList.toggle('flex', mode === 'quiz');

            document.getElementById('nav-study').className = mode === 'study' ? 'flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all text-gray-500 hover:bg-indigo-50';
            document.getElementById('nav-quiz').className = mode === 'quiz' ? 'flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-2.5 rounded-2xl font-bold text-sm flex justify-center items-center gap-2 transition-all text-gray-500 hover:bg-indigo-50';

            if(mode === 'quiz') startQuiz();
        }

        function selectTab(num) {
            currentTab = num;
            for(let i=1; i<=10; i++){
                const btn = document.getElementById(`tab-btn-${i}`);
                if(i === num) {
                    btn.className = 'snap-center flex-shrink-0 w-11 h-11 rounded-2xl font-bold text-lg border-b-4 transition-all bg-indigo-600 text-white border-indigo-800 scale-105';
                } else {
                    btn.className = 'snap-center flex-shrink-0 w-11 h-11 rounded-2xl font-bold text-lg border-b-4 transition-all bg-white text-gray-700 border-gray-200';
                }
            }
            renderStudyTable();
        }

        function renderStudyTable() {
            document.getElementById('study-title').innerText = `Tabuada do ${currentTab}`;
            const list = document.getElementById('study-list');
            list.innerHTML = '';
            const emoji = emojis[(currentTab - 1) % emojis.length];

            for(let i=1; i<=10; i++){
                const res = currentTab * i;
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-2.5 bg-indigo-50/50 rounded-2xl border border-indigo-100/60';
                row.innerHTML = `
                    <span class="text-lg font-bold text-indigo-900">${currentTab} × ${i} = <span class="text-pink-600 font-extrabold">${res}</span></span>
                    <span class="text-xs bg-white px-2 py-1 rounded-xl shadow-sm text-gray-500 border">${emoji.repeat(Math.min(i, 5))} ${i>5?'+':''}</span>
                `;
                list.appendChild(row);
            }
        }

        function speakCurrentTable() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let text = `Tabuada do ${currentTab}. `;
            for(let i=1; i<=10; i++) text += `${currentTab} vezes ${i} é igual a ${currentTab*i}. `;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function startQuiz() {
            score = 0; correctAnswers = 0; wrongAnswers = 0; quizIndex = 0;
            quizQuestions = [];
            for(let i=0; i<10; i++){
                const a = Math.floor(Math.random()*10)+1;
                const b = Math.floor(Math.random()*10)+1;
                quizQuestions.push({ a, b, ans: a*b });
            }
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('quiz-box').classList.add('flex');
            document.getElementById('quiz-results').classList.add('hidden');
            document.getElementById('quiz-results').classList.remove('flex');
            updateQuizHeader();
            renderQuestion();
        }

        function updateQuizHeader() {
            document.getElementById('score-display').innerText = `${score} pts`;
            document.getElementById('correct-count').innerText = correctAnswers;
            document.getElementById('wrong-count').innerText = wrongAnswers;
        }

        function playAudio(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                if(type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                } else {
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.1);
                }
                g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        function renderQuestion() {
            const q = quizQuestions[quizIndex];
            document.getElementById('q-num').innerText = quizIndex + 1;
            document.getElementById('q-progress').style.width = `${((quizIndex+1)/10)*100}%`;
            document.getElementById('question-text').innerText = `${q.a} × ${q.b} = ?`;
            
            const feedbackBox = document.getElementById('feedback-msg');
            feedbackBox.classList.add('hidden');
            feedbackBox.innerText = '';

            let opts = [q.ans];
            while(opts.length < 4){
                let fake = (Math.floor(Math.random()*10)+1) * (Math.floor(Math.random()*10)+1);
                if(!opts.includes(fake)) opts.push(fake);
            }
            opts.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('answers-grid');
            grid.innerHTML = '';
            opts.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'py-3.5 bg-white border-2 border-indigo-200 text-indigo-900 font-extrabold text-2xl rounded-2xl shadow-sm hover:border-indigo-500 active:scale-95 transition-all btn-push';
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val, q, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, q, selectedBtn) {
            const feedbackBox = document.getElementById('feedback-msg');
            feedbackBox.classList.remove('hidden');
            
            const allBtns = Array.from(document.getElementById('answers-grid').children);
            allBtns.forEach(b => b.disabled = true);

            let delayMs = 1200;

            if(selected === q.ans) {
                playAudio('correct');
                score += 10; correctAnswers++;
                selectedBtn.classList.remove('bg-white', 'border-indigo-200');
                selectedBtn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                
                feedbackBox.className = "w-full p-3 rounded-2xl text-xs sm:text-sm font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center justify-center gap-1";
                feedbackBox.innerHTML = "✨ <b>Muito bem!</b> Resposta correta!";
                confetti({ particleCount: 30, spread: 60, origin: { y: 0.7 } });
            } else {
                playAudio('wrong');
                wrongAnswers++;
                delayMs = 10000; // Tempo configurado para 10 segundos

                selectedBtn.classList.remove('bg-white', 'border-indigo-200');
                selectedBtn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');

                allBtns.forEach(b => {
                    if(parseInt(b.innerText) === q.ans) {
                        b.classList.remove('bg-white', 'border-indigo-200');
                        b.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
                    }
                });

                const additionArray = Array(q.b).fill(q.a);
                const additionText = additionArray.length <= 5 ? additionArray.join(' + ') : `${q.a} somado ${q.b} vezes`;

                feedbackBox.className = "w-full p-3 rounded-2xl text-xs sm:text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200 text-left";
                feedbackBox.innerHTML = `
                    <div class="font-bold text-rose-700 mb-0.5">💡 Ops! O correto é ${q.ans}</div>
                    <div class="text-xs text-rose-600">
                        <b>Por quê?</b> ${q.a} × ${q.b} significa somar <b>${q.a}</b> (${q.b} vezes):<br>
                        <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-rose-200 inline-block mt-1">${additionText} = ${q.ans}</span>
                    </div>
                `;
            }
            
            updateQuizHeader();

            setTimeout(() => {
                quizIndex++;
                if(quizIndex < 10) renderQuestion();
                else showResults();
            }, delayMs);
        }

        function showResults() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('flex');
            document.getElementById('quiz-results').classList.remove('hidden');
            document.getElementById('quiz-results').classList.add('flex');

            document.getElementById('final-score').innerText = `Pontuação: ${score} pts`;
            document.getElementById('final-stats').innerText = `${correctAnswers} acertos / ${wrongAnswers} erros`;

            let stars = '⭐';
            if(correctAnswers >= 7) stars = '⭐⭐';
            if(correctAnswers >= 9) stars = '⭐⭐⭐';
            document.getElementById('stars-result').innerText = stars;

            if(correctAnswers >= 7) confetti({ particleCount: 100, spread: 100, origin: { y: 0.5 } });
        }

        selectTab(1);
        lucide.createIcons();
    </script>
</body>
</html>
